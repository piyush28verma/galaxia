<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galaxia — Universal Autonomous Intelligence & Assurance Tool</title>
    <meta name="description" content="Sub-second intelligence, grounded fact-checking, and static security analysis powered by Groq LPU and verified with SharedOS cryptographic receipts." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              heading: ['"Outfit"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              galaxy: {
                950: '#070913',
                900: '#0d1127',
                850: '#111736',
                800: '#161d44',
                700: '#222d69',
                600: '#38469e',
                500: '#6366f1',
                400: '#818cf8',
                300: '#a5b4fc',
                accent: '#ec4899',
                gold: '#f59e0b',
                emerald: '#10b981',
                cyan: '#06b6d4',
              }
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
              'spin-slow': 'spin 12s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
                '50%': { transform: 'translateY(-8px) rotate(2deg)' },
              }
            }
          }
        }
      }
    </script>
  </head>
  <body class="min-h-screen antialiased selection:bg-pink-500 selection:text-white transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
